# Tiny Tapeout project information
project:
  title:        "SID 6581 / 8580 Replica"
  author:       "Jason van Aardt"
  discord:      ""
  description:  "Drop-in digital replica of the MOS 6581/8580 SID: three voices, ADSR envelopes and the two-integrator filter, clocked from the C64 phi2 at the original rate."
  language:     "Verilog"
  clock_hz:     985248   # phi2, PAL C64. NTSC is 1022727 Hz.
  # Synthesised against sky130_fd_sc_hd the design is 66566 um2, which is
  # 43% of a 4x2 tile (682.64 x 225.76 um = 154113 um2).  3x2 would be 58%
  # before clock tree and fill, which is tighter than is comfortable.
  tiles:        "4x2"
  top_module:   "tt_um_sid6581"

  source_files:
    - "sid_voice.v"
    - "sid_envelope.v"
    - "sid_fc_curve.v"
    - "sid_q_table.v"
    - "sid_audio.v"
    - "sid_dac.v"
    - "sid_core.v"
    - "project.v"

# The dedicated inputs carry the whole 6581 host interface except the
# data bus, which needs the bidirectional pins.
pinout:
  ui[0]: "A0 - address bit 0 (6581 pin 9)"
  ui[1]: "A1 - address bit 1 (6581 pin 10)"
  ui[2]: "A2 - address bit 2 (6581 pin 11)"
  ui[3]: "A3 - address bit 3 (6581 pin 12)"
  ui[4]: "A4 - address bit 4 (6581 pin 13)"
  ui[5]: "/CS - chip select, active low, must be phi2-qualified (6581 pin 8)"
  ui[6]: "R//W - high to read, low to write (6581 pin 7)"
  ui[7]: "EXT IN - 1-bit sigma-delta audio input into the filter (6581 pin 26)"

  uo[0]: "AUDIO OUT - 2nd-order sigma-delta, needs an RC reconstruction filter (6581 pin 27)"
  uo[1]: "I2S SD - serial audio data"
  uo[2]: "I2S WS - word select"
  uo[3]: "I2S SCK - bit clock (= phi2)"
  uo[4]: "Sample strobe - one pulse per filter sample (phi2/8)"
  uo[5]: "OSC3 MSB - voice 3 oscillator MSB"
  uo[6]: "ENV3 active - voice 3 envelope is non-zero"
  uo[7]: ""

  uio[0]: "D0 - data bus bit 0 (6581 pin 15)"
  uio[1]: "D1 - data bus bit 1 (6581 pin 16)"
  uio[2]: "D2 - data bus bit 2 (6581 pin 17)"
  uio[3]: "D3 - data bus bit 3 (6581 pin 18)"
  uio[4]: "D4 - data bus bit 4 (6581 pin 19)"
  uio[5]: "D5 - data bus bit 5 (6581 pin 20)"
  uio[6]: "D6 - data bus bit 6 (6581 pin 21)"
  uio[7]: "D7 - data bus bit 7 (6581 pin 22)"

yaml_version: 6
